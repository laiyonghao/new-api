# New-API Docker Compose Configuration
# 
# Quick Start:
#   1. docker-compose up -d
#   2. Access at http://localhost:3000
#
# Using MySQL instead of PostgreSQL:
#   1. Comment out the postgres service and SQL_DSN line 15
#   2. Uncomment the mysql service and SQL_DSN line 16
#   3. Uncomment mysql in depends_on (line 28)
#   4. Uncomment mysql_data in volumes section (line 64)
#
# ⚠️  IMPORTANT: Change all default passwords before deploying to production!

version: '3.4' # For compatibility with older Docker versions

services:
  new-api:
    image: calciumion/new-api:latest
    container_name: new-api
    restart: always
    command: --log-dir /app/logs
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
      - ./logs:/app/logs
    environment:
      - SQL_DSN=postgresql://root:123456@postgres:5432/new-api # ⚠️ IMPORTANT: Change the password in production!
#      - SQL_DSN=root:123456@tcp(mysql:3306)/new-api  # Point to the mysql service, uncomment if using MySQL
      - REDIS_CONN_STRING=redis://:123456@redis:6379 # ⚠️ IMPORTANT: Change the password in production!
      - TZ=Asia/Shanghai
      - ERROR_LOG_ENABLED=true # 是否启用错误日志记录 (Whether to enable error log recording)
      - BATCH_UPDATE_ENABLED=true  # 是否启用批量更新 (Whether to enable batch update)
      - NODE_NAME=new-api-node-1  # 节点名称，用于审计日志中标识节点身份；多节点/容器部署时建议设置 (Node name used in audit logs; recommended when running multiple instances or in containers)
#      - STREAMING_TIMEOUT=300  # 流模式无响应超时时间，单位秒，默认120秒，如果出现空补全可以尝试改为更大值 （Streaming timeout in seconds, default is 120s. Increase if experiencing empty completions）
#      - SESSION_SECRET=random_string  # 多机部署时设置，必须修改这个随机字符串！！ （multi-node deployment, set this to a random string!!!!!!!）
#      - SYNC_FREQUENCY=60  # Uncomment if regular database syncing is needed
#      - GOOGLE_ANALYTICS_ID=G-XXXXXXXXXX  # Google Analytics 的测量 ID (Google Analytics Measurement ID)
#      - UMAMI_WEBSITE_ID=xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx  # Umami 网站 ID (Umami Website ID)
#      - UMAMI_SCRIPT_URL=https://analytics.umami.is/script.js  # Umami 脚本 URL，默认为官方地址 (Umami Script URL, defaults to official URL)

    depends_on:
      - redis
      - postgres
#      - mysql  # Uncomment if using MySQL
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:3000/api/status | grep -o '\"success\":\\s*true' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  argus:
    build:
      context: .
      dockerfile: argus/Dockerfile
    image: cheaptoken-argus:local
    container_name: argus
    restart: always
    expose:
      - "8000"
    environment:
      - DJANGO_DEBUG=0
      - DJANGO_SECRET_KEY=${ARGUS_DJANGO_SECRET_KEY:?set ARGUS_DJANGO_SECRET_KEY before starting argus}
      - ARGUS_ALLOWED_HOSTS=ct.xhh.club,cheaptoken.io,www.cheaptoken.io
      - ARGUS_CSRF_TRUSTED_ORIGINS=https://ct.xhh.club,https://cheaptoken.io,https://www.cheaptoken.io
      - ARGUS_SECURE_SSL_REDIRECT=1
      - ARGUS_SESSION_COOKIE_SECURE=1
      - ARGUS_CSRF_COOKIE_SECURE=1
      - ARGUS_SECURE_HSTS_SECONDS=31536000
      - ARGUS_DATABASE_URL=${ARGUS_DATABASE_URL:-postgresql://root:123456@postgres:5432/argus}
      - ARGUS_DB_SCHEMA=${ARGUS_DB_SCHEMA:-}
      - ARGUS_REDIS_URL=${ARGUS_REDIS_URL:-redis://:123456@redis:6379/2}
      - ARGUS_CACHE_KEY_PREFIX=${ARGUS_CACHE_KEY_PREFIX:-argus}
      - ARGUS_STATIC_URL=/static/
      - ARGUS_EMAIL_BACKEND=${ARGUS_EMAIL_BACKEND:-django.core.mail.backends.smtp.EmailBackend}
      - ARGUS_EMAIL_HOST=${ARGUS_EMAIL_HOST:-}
      - ARGUS_EMAIL_PORT=${ARGUS_EMAIL_PORT:-587}
      - ARGUS_EMAIL_USE_TLS=${ARGUS_EMAIL_USE_TLS:-1}
      - ARGUS_EMAIL_HOST_USER=${ARGUS_EMAIL_HOST_USER:-}
      - ARGUS_EMAIL_HOST_PASSWORD=${ARGUS_EMAIL_HOST_PASSWORD:-}
      - ARGUS_EMAIL_FROM=${ARGUS_EMAIL_FROM:-noreply@cheaptoken.io}
      - ARGUS_EPAY_ENABLED=${ARGUS_EPAY_ENABLED:-0}
      - ARGUS_EPAY_URL=${ARGUS_EPAY_URL:-}
      - ARGUS_EPAY_PID=${ARGUS_EPAY_PID:-}
      - ARGUS_EPAY_KEY=${ARGUS_EPAY_KEY:-}
      - ARGUS_EPAY_NOTIFY_URL=${ARGUS_EPAY_NOTIFY_URL:-}
      - ARGUS_EPAY_RETURN_URL=${ARGUS_EPAY_RETURN_URL:-}
      - TZ=Asia/Shanghai
    depends_on:
      - redis
      - postgres
    networks:
      - new-api-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; request = urllib.request.Request('http://127.0.0.1:8000/', headers={'Host': 'ct.xhh.club', 'X-Forwarded-Proto': 'https'}); urllib.request.urlopen(request, timeout=5).read()\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    command: ["redis-server", "--requirepass", "123456"]  # ⚠️ IMPORTANT: Change this password in production!
    networks:
      - new-api-network

  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
      POSTGRES_DB: new-api
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - new-api-network
#    ports:
#      - "5432:5432"  # Uncomment if you need to access PostgreSQL from outside Docker

#  mysql:
#    image: mysql:8.2
#    container_name: mysql
#    restart: always
#    environment:
#      MYSQL_ROOT_PASSWORD: 123456  # ⚠️ IMPORTANT: Change this password in production!
#      MYSQL_DATABASE: new-api
#    volumes:
#      - mysql_data:/var/lib/mysql
#    networks:
#      - new-api-network
#    ports:
#      - "3306:3306"  # Uncomment if you need to access MySQL from outside Docker

volumes:
  pg_data:
#  mysql_data:

networks:
  new-api-network:
    driver: bridge
